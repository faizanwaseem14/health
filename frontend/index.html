<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="HealthVault — your lab reports and health records, organized, explained in plain language, and kept private."
    />
    <meta name="theme-color" content="#FAF5EC" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FAF5EC'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%234F5F45' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23A85C3F' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%234F5F45'/%3E%3C/svg%3E"
    />

    <!-- Fraunces (display/headline serif) + Figtree (body/UI sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>HealthVault — your health records, organized</title>

    <!--
      Applies a returning visitor's saved theme choice BEFORE the page
      paints, so there's no flash of light mode before React mounts.
      Light is still always the default for a first-time visitor —
      this only ever reads a choice the person already made
      themselves (see src/theme/ThemeProvider.jsx), never the OS
      preference.
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("healthvault:theme");
          if (saved === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          /* storage unavailable — light default applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
